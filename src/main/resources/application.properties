spring.application.name=condoeconomy-api

# Banco de Dados PostgreSQL (Local via Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/condoeconomy_db}
spring.datasource.username=${DB_USERNAME:condoadmin}
spring.datasource.password=${DB_PASSWORD:condopassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate (Flyway gerencia o schema com versionamento V1..V25)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Logs
logging.level.org.springframework.security=INFO
logging.level.com.condoeconomy=INFO

# E-mail (Notificações)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:seuemail@gmail.com}
spring.mail.password=${MAIL_PASSWORD:suasenha}

# Segurança JWT (Assinatura HMAC-256)
api.security.token.secret=${JWT_SECRET:condoeconomy-secret-key-123-dev-only-do-not-use-in-prod}

# CORS permitido
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://app.condoeconomy.com}

# Spring Boot Actuator (Health Checks & Observabilidade)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

