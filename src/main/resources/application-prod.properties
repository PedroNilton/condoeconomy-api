spring.application.name=condoeconomy-api

# Banco de Dados PostgreSQL Produção
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Produção)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Logs Estritos
logging.level.root=WARN
logging.level.com.condoeconomy=INFO
logging.level.org.springframework.security=WARN

# E-mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Seguranca JWT (Obrigatorio JWT_SECRET em Producao)
api.security.token.secret=${JWT_SECRET:chave-secreta-de-producao-com-mais-de-32-caracteres-256bits}

# CORS permitido
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173,http://localhost:3000,https://app.condoeconomy.com}

# Spring Boot Actuator (Health Checks de Produção)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# Web Push VAPID Keys
vapid.public.key=${VAPID_PUBLIC_KEY:BB+new06uBT5YB+9+1AKsnmR4BzLo9RA4OCyF1RtZhw8gHLggZ1wRChnVqR/34EiiF073qSESe5BOqKT+EAb5XU=}
vapid.private.key=${VAPID_PRIVATE_KEY:EC59+AXBNmYivh1z7K7LUtzJXuoPp8y9ii8KYkygJ/c=}

# Gateway de Pagamento Asaas (API v3) e Segurança de Webhooks
asaas.api.url=${ASAAS_API_URL:https://sandbox.asaas.com/api/v3}
asaas.api.key=${ASAAS_API_KEY:}
asaas.webhook.token=${ASAAS_WEBHOOK_TOKEN:}

# Firebase Cloud Messaging (Opcional)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
