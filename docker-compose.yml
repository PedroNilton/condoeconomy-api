services:
  db:
    image: postgres:15-alpine
    container_name: condoeconomy-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-condoadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-condopassword}
      POSTGRES_DB: ${DB_NAME:-condoeconomy_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-condoadmin} -d ${DB_NAME:-condoeconomy_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - condonet

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: condoeconomy-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-condoeconomy_db}
      DB_USERNAME: ${DB_USERNAME:-condoadmin}
      DB_PASSWORD: ${DB_PASSWORD:-condopassword}
      JWT_SECRET: ${JWT_SECRET:-condoeconomy-secret-key-123-dev-only-do-not-use-in-prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:3000,https://app.condoeconomy.com}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - condonet

  frontend:
    build:
      context: ../condoeconomy-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: condoeconomy-web
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
      - "80:80"
    networks:
      - condonet

volumes:
  pgdata:

networks:
  condonet:
    driver: bridge
